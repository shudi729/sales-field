<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="面向大客户销售人员的沉浸式模拟训练游戏：动态客户、自由话术、关键人博弈与连续项目后果。">
  <meta name="theme-color" content="#28c66f">
  <link rel="icon" href="assets/favicon.svg">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/premium-v8.css">
  <link rel="stylesheet" href="styles/premium-v9.css">
  <title>销练场 V9｜高级动态销售实战</title>
</head>
<body>
  <main id="landing" class="landing">
    <section class="hero">
      <span>SALES FIELD · DYNAMIC CAMPAIGN</span>
      <h1>不是做题<br>是<em>操盘客户</em></h1>
      <p>客户人物有隐藏立场，竞争对手会主动推进，时间、预算、关系与承诺会一路影响投标、谈判和交付。</p>
      <button id="start">登录并生成一场新战役 →</button>
    </section>
    <aside>
      <div class="board">
        <small>CONFIDENTIAL</small>
        <h2>客户组织战场</h2>
        <p>人物 · 情报 · 竞争 · 时间</p>
        <i class="t1"></i>
        <i class="t2"></i>
        <b class="pin p1">王</b>
        <b class="pin p2">?</b>
        <b class="pin p3">竞</b>
      </div>
    </aside>
  </main>
  <main id="app" class="hide"></main>
  <div id="layer"></div>
  <script type="module" src="src/app.js"></script>
</body>
</html>
