function seeded(s,n){let x=Math.sin(s*9301+n*49297)*233280;return x-Math.floor(x)}function people(s){let roles=['把关者','推动者','风险者','拍板者','商务控制者','潜在教练'];return baseNames.map((n,i)=>({id:i,name:n[0],title:n[1],role:roles[i],concern:concerns[(i+Math.floor(seeded(s,i)*6))%6],motive:motives[(i*2+Math.floor(seeded(s,i+8)*6))%6],attitude:28+Math.floor(seeded(s,i+20)*38),influence:[72,83,62,98,78,40][i],known:i<2,ally:false}))}function reset(){let s=Math.floor(Date.now()/1000)%997;g={seed:s,stage:0,day:1,energy:8,budget:60,trust:38,intel:0,threat:18,progress:0,target:0,people:people(s),logs:[],turns:0};brief()}function chance(){return Math.max(8,Math.min(92,Math.round(g.progress*.34+g.trust*.27+g.intel*1.25-g.threat*.3)))}function log(kind,text,effect){g.logs.unshift({day:g.day,kind,text,effect});g.logs=g.logs.slice(0,12)}function brief(){$('#landing').classList.add('hide');$('#app').classList.remove('hide');$('#app').innerHTML=`<section class="brief"><span>CAMPAIGN 001 · DYNAMIC WORLD</span><h1>${user.nickname}，客户世界<br>不会等你准备好。</h1><p>华东制造集团正在寻找AI知识管理方案。每个人物都有隐藏动机，每一次行动都会消耗时间并推动竞品。</p><div class="facts"><div><b>28</b><span>天项目窗口</span></div><div><b>60K</b><span>可投入资源</span></div><div><b>6</b><span>隐藏立场人物</span></div><div><b>50</b><span>随机实战事件</span></div></div><button id="enter">接受任务 · 进入客户组织 →</button></section>`;$('#enter').onclick=render}
function render(){let p=g.people[g.target],acts=actions[g.stage];$('#app').innerHTML=`<header class="hud"><button class="logo">销练场<small>LIVE CAMPAIGN</small></button><div class="stageTitle"><span>STAGE 0${g.stage+1}</span><b>${stages[g.stage][0]}</b><small>${stages[g.stage][1]}</small></div><div class="resources"><div class="res"><span>天数</span><b>${g.day}/28</b></div><div class="res"><span>行动力</span><b>${g.energy}/8</b></div><div class="res"><span>预算</span><b>${g.budget}K</b></div><div class="res"><span>赢面</span><b>${chance()}%</b></div></div><button class="feedback" id="feedback">判定反馈</button></header><nav class="path">${stages.map((s,i)=>`<div class="${i<g.stage?'done':i===g.stage?'active':''}"><i>${i<g.stage?'✓':i+1}</i><span>${s[0]}</span></div>`).join('')}</nav><section class="world"><aside class="left"><header><span>FIELD INTELLIGENCE</span><b>实时局势</b></header>${meter('客户信任',g.trust)}${meter('情报完整',Math.min(100,g.intel*5))}${meter('竞品威胁',g.threat,true)}<div class="opponent"><span>竞争对手</span><b>云智科技</b><p>${g.threat>70?'已影响采购标准，正在锁定商务条件。':g.threat>40?'正在接触生产与采购负责人。':'尚未形成组织联盟。'}</p></div><div class="log"><span>战场记录</span>${g.logs.length?g.logs.slice(0,5).map(l=>`<article><i>D${l.day}</i><p>${l.text}</p><small>${l.effect}</small></article>`).join(''):'<p style="font-size:8px;color:var(--muted)">每个动作都会影响后续阶段。</p>'}</div></aside><section class="center"><header><div><span>华东制造集团 · 客户组织</span><h1>${stages[g.stage][1]}</h1></div><div class="progress"><span>阶段推进</span><b>${g.progress}%</b><i><em style="width:${g.progress}%"></em></i></div></header><div class="org"><svg viewBox="0 0 900 500"><path d="M450 70 L210 210 L450 430 L700 210 Z"/><path d="M450 70 L450 430 M210 210 L700 210"/></svg>${g.people.map((x,i)=>`<button class="person p${i} ${i===g.target?'selected':''} ${x.known?'':'unknown'} ${x.ally?'ally':''}" data-person="${i}"><i>${x.name[0]}</i><span><b>${x.name}</b><small>${x.title}</small></span><em>${x.known?x.role:'立场未知'}</em>${x.ally?'<strong>内部教练</strong>':''}</button>`).join('')}<div class="core"><span>AI知识库项目</span><b>${chance()}%</b><small>动态赢面</small></div></div><div class="dossier"><div class="portrait">${p.name[0]}</div><div><span>${p.title} · 影响力 ${p.influence}</span><h2>${p.name}</h2><p>${p.known?`真实顾虑：${p.concern}。个人动机：${p.motive}。`:'你只知道他的职务。继续调查或直接接触，都要承担错判风险。'}</p></div><button id="reveal" ${p.known||g.energy<1?'disabled':''}>${p.known?'档案已确认':'消耗1行动力核验 →'}</button></div></section><aside class="right"><header><span>YOUR MOVE</span><b>选择下一步行动</b><p>对象：${p.name} · 客户和竞品不会停止行动。</p></header><div class="actions">${acts.map((a,i)=>`<button data-act="${i}" ${g.energy<a[3]||g.budget<a[4]?'disabled':''}><i>${a[1]}</i><span><b>${a[0]}</b><small>${a[2]}</small></span><em>-${a[3]}行动 ${a[4]?'· -'+a[4]+'K':''}</em></button>`).join('')}</div><div class="rules"><span>系统正在暗中判定</span>${stages[g.stage][2].map(x=>`<i>${x}</i>`).join('')}</div><button class="end" id="next" ${g.progress<65?'disabled':''}>${g.progress<65?'还需推进 '+(65-g.progress)+'%':g.stage===6?'结束战役 · 查看结局 →':'承担后果 · 进入'+stages[g.stage+1][0]+' →'}</button></aside></section>`;bind()}
function meter(n,v,d){return `<div class="meter ${d?'danger':''}"><span>${n}</span><b>${v}%</b><i><em style="width:${Math.max(3,v)}%"></em></i></div>`}function bind(){document.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>{g.target=+b.dataset.person;render()});document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(actions[g.stage][+b.dataset.act]));$('#reveal').onclick=()=>{if(g.people[g.target].known)return;g.energy--;g.people[g.target].known=true;log('情报','确认了'+g.people[g.target].name+'的真实关注','发现：'+g.people[g.target].concern);render()};$('#next').onclick=()=>{if(g.stage===6){report();return}g.stage++;g.progress=Math.max(8,Math.round(g.progress*.16));g.energy=8;log('推进','进入'+stages[g.stage][0],'前期状态全部继承');render()};$('#feedback').onclick=feedback}
function act(a){let p=g.people[g.target];if(a[8]==='dialogue'){if(g.energy<a[3])return;g.energy-=a[3];g.threat=Math.min(100,g.threat+3);g.day++;log('客户会谈','进入'+p.name+'的现场','消耗2行动 / 竞品 +3');meeting();return}let delta=Math.max(8,a[5]+(p.known?4:-2)+(p.ally?5:0)-Math.floor(g.threat/15));g.energy-=a[3];g.budget-=a[4];g.intel+=a[6];g.trust=Math.min(100,g.trust+a[7]+(p.known?1:0));g.progress=Math.min(100,g.progress+delta);g.threat=Math.min(100,g.threat+4);g.day++;p.attitude=Math.min(96,p.attitude+a[7]+2);p.known=p.known||a[6]>1;p.ally=p.ally||((g.stage===1||g.stage===3)&&p.attitude>56);log(stages[g.stage][0],a[0]+' · '+p.name,'推进 +'+delta+' / 竞品 +4');if((g.day+g.stage)%2===0){fieldEvent();return}render()}
function fieldEvent(){let i=(g.seed*7+(g.day+g.stage)*13)%stories.length,pos=(i+g.day)%3===0,e={title:stories[i],cat:i<11?'开局策略':i<16?'信息战':i<28?'组织政治':i<42?'价值攻防':'控局推进',trust:pos?4:-3,threat:pos?-3:7,budget:pos?0:-4};g.trust=Math.max(0,Math.min(100,g.trust+e.trust));g.threat=Math.max(0,Math.min(100,g.threat+e.threat));g.budget=Math.max(0,g.budget+e.budget);$('#layer').innerHTML=`<div class="overlay"><section class="event"><span>UNEXPECTED FIELD EVENT · ${e.cat}</span><h2>《${e.title}》</h2><p>${pos?'你之前留下的信息形成回流，局势出现了可利用的窗口。':'客户组织发生了你无法控制的变化，原来的赢单假设需要修正。'}</p><div class="effects"><b class="${e.trust<0?'bad':''}">信任 ${e.trust}</b><b class="${e.threat>0?'bad':''}">竞品 ${e.threat}</b><b class="${e.budget<0?'bad':''}">预算 ${e.budget}</b></div><button id="accept">接受变化 · 继续作战 →</button></section></div>`;$('#accept').onclick=()=>{$('#layer').innerHTML='';log('突发事件',e.title,e.cat+'改变局势');render()}}
function meeting(){let p=g.people[g.target];$('#layer').innerHTML=`<div class="overlay"><section class="meeting"><div class="visual"><div class="meetingPerson"><i>${p.name[0]}</i><b>${p.name}</b><small>${p.title}</small></div><blockquote id="reply">“${p.name}：你只有十分钟。别先讲产品，你到底想确认什么？”</blockquote></div><div class="console"><span>LIVE DIALOGUE · 没有标准选项</span><h2>你会怎么说？</h2><p id="coach">客户会根据你的提问、承诺、证据和推进意图改变回应。</p><form id="talk"><textarea id="draft" autofocus placeholder="直接输入你在真实现场会说的话……"></textarea><button>说给客户听 ↗</button></form><button id="leave" style="margin-top:65px;border:0;background:none;color:var(--muted)">带着当前结果离开</button></div></section></div>`;$('#talk').onsubmit=e=>{e.preventDefault();let t=$('#draft').value.trim();if(!t)return;let j=judgeTalk(t,p);g.trust=Math.max(0,Math.min(100,g.trust+Math.round((j.score-45)/7)));g.progress=Math.min(100,g.progress+Math.round(j.score/4));p.known=true;p.attitude=Math.min(96,p.attitude+Math.round((j.score-45)/8));p.ally=p.ally||j.score>80;g.turns++;if(g.turns>1)g.day++;log('自由会谈','你对'+p.name+'说：'+t.slice(0,25),'会谈质量 '+j.score);$('#reply').textContent='“'+j.reply+'”';$('#coach').textContent=j.coach;$('#draft').value=''};$('#leave').onclick=()=>{$('#layer').innerHTML='';render()}}
function judgeTalk(t,p){let q=/[?？]|什么|如何|为什么|谁|多少|多久|能否/.test(t),impact=/影响|代价|损失|风险|成本|周期|事故|指标/.test(t),people=/谁|决策|拍板|参与|部门|汇报/.test(t),next=/下一步|安排|会议|调研|时间|一起|确认/.test(t),dump=/功能|参数|平台|大模型|准确率|私有化/.test(t)&&!q,over=/保证|一定|绝对|没问题/.test(t),score=Math.max(12,Math.min(94,38+(q?12:0)+(impact?15:0)+(people?12:0)+(next?15:0)+Math.min(g.intel,12)-(dump?16:0)-(over?22:0))),reply=p.name+'：你问得有点泛。我们最担心的是'+p.concern+'。';if(over)reply=p.name+'：这种保证谁都会说。出了问题，谁负责？';else if(dump)reply=p.name+'：功能我听过很多了。它跟“'+p.concern+'”有什么关系？';else if(people)reply=p.name+'：我能影响，但不能独自拍板。谁愿意承担改变的风险？';else if(impact)reply=p.name+'：不改变的代价是新人上手慢和质量事故重复发生。';else if(next)reply=p.name+'：可以，把成功标准草案发来，我帮你约相关部门。';return{score,reply,coach:score>=72?'你用问题换到了新信息或承诺，客户立场开始移动。':'这句话没有换到足够的新事实。应追问影响、人物或明确下一步。'}}
function report(){let allies=g.people.filter(p=>p.ally).length,score=Math.max(20,Math.min(96,Math.round(g.trust*.35+g.intel*2+allies*8+(100-g.threat)*.25-(g.day>28?(g.day-28)*2:0)))),ending=score>=78?'战略伙伴':score>=60?'完成成交':'艰难交付',story=stories[(g.seed+score+g.day)%stories.length];$('#app').innerHTML=`<section class="report"><span>FULL CAMPAIGN · AFTER ACTION REPORT</span><h1>${ending}</h1><p>${user.nickname}，系统没有统计你答对了几题，而是复盘哪些动作真正改变了人物、标准、竞争与验收。</p><div class="score"><b>${score}</b><span>战役评分</span></div><div class="reportStats"><div><b>${g.day}</b><span>使用天数</span></div><div><b>${g.trust}</b><span>客户信任</span></div><div><b>${allies}</b><span>内部盟友</span></div><div><b>${g.threat}</b><span>竞品威胁</span></div></div><article><span>本局实战母题</span><h2>《${story}》</h2><p>${score>=70?'你建立了人物联盟，并用共同标准把产品竞争变成价值共识。':'你推动了项目，但对组织政治或竞争节奏控制不足，后期为前期遗漏付出了代价。'}</p></article><div class="reportLog">${g.logs.slice(0,6).map(l=>`<p><i>D${l.day}</i><b>${l.text}</b><em>${l.effect}</em></p>`).join('')}</div><button id="replay">生成新客户局势 · 重新开战 ↻</button></section>`;$('#replay').onclick=reset}
function feedback(){$('#layer').innerHTML=`<div class="overlay"><section class="modal"><button class="close">×</button><span>JUDGEMENT FEEDBACK</span><h2>哪里不像真实销售？</h2><textarea id="fb" placeholder="例如：客户不应立即提高信任……"></textarea><button class="submit" id="save">保存反馈</button></section></div>`;$('.close').onclick=()=>$('#layer').innerHTML='';$('#save').onclick=()=>{let t=$('#fb').value.trim();if(!t)return;let old=JSON.parse(localStorage.getItem('sales-field-feedback-v6')||'[]');old.push({stage:stages[g.stage][0],text:t,at:Date.now()});localStorage.setItem('sales-field-feedback-v6',JSON.stringify(old));$('#layer').innerHTML=''}}
$('#start').onclick=()=>{$('#layer').innerHTML=`<div class="overlay"><section class="modal"><button class="close">×</button><span>WELCOME TO THE FIELD</span><h2>生成你的销售战役</h2><p>体验版使用手机号和昵称建立本地档案，不发送验证码。</p><label>手机号码<input id="phone" inputmode="numeric" placeholder="请输入11位手机号"></label><label>训练昵称<input id="nick" placeholder="例如：小张"></label><p id="err" style="color:#b83e32"></p><button class="submit" id="login">登录并进入战役 →</button></section></div>`;$('.close').onclick=()=>$('#layer').innerHTML='';$('#login').onclick=()=>{let p=$('#phone').value.replace(/\s/g,''),n=$('#nick').value.trim();if(!/^1\d{10}$/.test(p)||n.length<2){$('#err').textContent='请输入11位手机号和至少2个字的昵称';return}user={phone:p,nickname:n};localStorage.setItem('sales-field-user-v6',JSON.stringify(user));$('#layer').innerHTML='';reset()}};
</script></body></html>
